<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d74e7"/>
      <stop offset="45%" stop-color="#164696"/>
      <stop offset="100%" stop-color="#081d44"/>
    </linearGradient>
    <linearGradient id="capBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d5ec9"/>
      <stop offset="100%" stop-color="#0a1f44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Nền tròn huy hiệu giúp hiển thị rõ nét trên cả tab sáng & tối -->
  <circle cx="32" cy="32" r="30" fill="#081736" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Chóp mũ bên dưới -->
  <path d="M 18 31 v 11 c 0 6.5 6.5 11 14 11 s 14 -4.5 14 -11 V 31 c -4 2.5 -8.8 4 -14 4 s -10 -1.5 -14 -4 Z" fill="url(#capBase)" filter="url(#shadow)"/>
  
  <!-- Mặt nón cử nhân hình thoi -->
  <polygon points="32,13 5,26 32,39 59,26" fill="url(#capTop)" stroke="url(#gold)" stroke-width="1.2" filter="url(#shadow)"/>
  
  <!-- Nút tâm mũ -->
  <circle cx="32" cy="26" r="3.2" fill="url(#gold)"/>
  
  <!-- Dây tua rua vàng -->
  <path d="M 32 26 Q 44 26 50 34 T 52 46" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Đuôi tua rua rủ xuống -->
  <polygon points="49.5,46 54.5,46 55.5,53.5 48.5,53.5" fill="url(#gold)"/>
  <circle cx="52" cy="46" r="2.2" fill="#ffe28a"/>
</svg>
